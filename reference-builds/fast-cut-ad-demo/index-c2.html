<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Plex";font-style:normal;font-weight:100 700;font-display:block;src:url("assets/fonts/IBMPlexSans-VF.woff2") format('woff2');}
@font-face{font-family:"Season";font-style:normal;font-weight:300 700;font-display:block;src:url("assets/fonts/SeasonMixUprightsVF.woff2") format('woff2');}

:root{
  --ground:#040120; --lift:#0B0538; --blue:#246CE0; --tint:#DAE8FF;
  --orange:#FD8502; --otint:#FFEDE4; --pink:#CE3DA2; --white:#fff; --dim:#837E97;
  /* the real app's dark chrome, sampled from client/ui-real */
  --appbg:#0B0F26; --appbg2:#080C1E; --appcard:#141A38; --appinset:#0D1230;
  --apptext:#E8ECF8; --appdim:#8A91B4; --appline:rgba(130,150,220,.16);
  --ink:#1B1830;
}
*{margin:0;padding:0;box-sizing:border-box}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);
  font-family:"Plex",sans-serif;-webkit-font-smoothing:antialiased}

/* ── footage ───────────────────────────────────────────────────── */
video.shot{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;z-index:1}

/* ── flash / whip ──────────────────────────────────────────────── */
.flash{position:absolute;inset:0;background:var(--tint);opacity:0;z-index:40;pointer-events:none}

/* ── captions ──────────────────────────────────────────────────── */
.cap{position:absolute;left:70px;right:70px;bottom:450px;z-index:30;display:flex;justify-content:center}
.cap span{display:inline-block;background:rgba(4,1,32,.86);color:#fff;font-size:54px;line-height:1.24;
  font-weight:700;letter-spacing:-.012em;padding:16px 30px;border-radius:18px;text-align:center;
  max-width:940px;box-shadow:0 0 60px rgba(4,1,32,.5)}
.cap em{font-style:normal;color:var(--tint)}

/* ── logo chips — in the darkened top band over the hands b-roll ── */
.chiprow{position:absolute;left:0;right:0;top:260px;z-index:20;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:34px}
.chip{width:150px;height:150px;border-radius:34px;background:rgba(253,248,240,.97);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 46px rgba(36,108,224,.34)}
.chip img{width:84px;height:84px;object-fit:contain}
.chip.sq img{width:74px;height:74px}

/* block D: the reference's organic graph — curved dotted spokes around a hub */
#midchips{position:absolute;inset:0;z-index:20}
#midinner{position:absolute;inset:0}
#midchips .chip{position:absolute}
#webs{position:absolute;inset:0;width:1080px;height:1920px}
#webs path{fill:none;stroke:rgba(238,242,252,.75);stroke-width:3.5;
  stroke-linecap:round;stroke-dasharray:1 16}
.sdot{position:absolute;width:20px;height:20px;border-radius:50%}
.tdot{position:absolute;width:22px;height:22px;border-radius:50%}
#td1{left:205px;top:371px;background:#6EC6F0;box-shadow:0 0 20px rgba(110,198,240,.85)}
#td2{left:853px;top:1131px;background:#F2994A;box-shadow:0 0 20px rgba(242,153,74,.85)}
#td3{left:853px;top:751px;background:#6FCF97;box-shadow:0 0 20px rgba(111,207,151,.85)}

/* ── split screen (the client's call, final): the presenter below, the tool UIs above ── */
#splitwrap{position:absolute;left:0;top:960px;width:1080px;height:960px;overflow:hidden;z-index:12}
#splitwrap video{position:absolute;left:0;top:-380px;width:1080px;height:1920px;object-fit:cover}
#toolpane{position:absolute;left:0;top:0;width:1080px;height:960px;z-index:13;
  background:#FDF8F0;border-bottom:4px solid rgba(27,24,48,.12);overflow:hidden}
.tcard{position:absolute;left:60px;top:70px;width:960px;height:820px;border-radius:28px;
  background:#fff;border:2px solid rgba(27,24,48,.10);overflow:hidden;
  box-shadow:0 18px 60px rgba(27,24,48,.14)}
.tbar{height:78px;background:#F4F1EA;display:flex;align-items:center;gap:12px;padding:0 26px}
.tbar i{width:16px;height:16px;border-radius:50%;background:#D9D4C8;display:block}
.tbar img{width:40px;height:40px;object-fit:contain;margin-left:12px}
.tbar span{font-size:30px;font-weight:600;color:var(--ink)}
.tbody{padding:30px 34px;height:calc(100% - 78px)}
.dline{height:20px;border-radius:8px;background:#E4E0D5;margin-bottom:18px}
.w95{width:95%}.w92{width:92%}.w90{width:90%}.w85{width:85%}.w80{width:80%}
.w70{width:70%}.w60{width:60%}.w40{width:40%}.w0{width:0;height:8px}
/* docs */
.docs .doctool{height:54px;border-radius:12px;background:#4C8BEA;margin-bottom:24px;opacity:.85}
.docs .docpage{background:#FBFAF6;border:2px solid #ECE8DD;border-radius:14px;padding:34px 40px;height:560px}
/* chatgpt */
.gpt .gmsg{border-radius:18px;padding:22px 26px;margin-bottom:22px;font-size:28px;line-height:1.4}
.gpt .user{background:#E8E5DC;color:var(--ink);max-width:80%;margin-left:auto}
.gpt .bot{background:#F4F1EA}
.gpt .bot .dline{background:#DDD8CB}
.gpt .gcomposer{position:absolute;left:34px;right:34px;bottom:30px;border:2px solid #D9D4C8;
  border-radius:16px;padding:20px 24px;font-size:27px;color:#8C879C}
/* gmail */
.mail .mrow{display:flex;gap:18px;align-items:baseline;padding:24px 10px;border-bottom:2px solid #EFEBE1;font-size:27px;color:#5E5A70}
.mail .mrow b{color:var(--ink);width:230px;flex:none;font-weight:600}
.mail .mrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail .unread{background:#F6F3EB;border-radius:12px}
.mail .unread b{font-weight:700}
/* calendar */
.cal .crow{display:flex;gap:20px;align-items:center;margin-bottom:26px}
.cal .crow>span{width:100px;flex:none;font-size:25px;color:#8C879C;text-align:right}
.cal .cev{flex:1;border-radius:12px;padding:18px 22px;font-size:27px;font-weight:600;color:#fff}
.cal .b{background:#4C8BEA}.cal .g{background:#3E9B63}.cal .o{background:#E8843C}.cal .p{background:#8A63C9}
/* slack */
.slack .smsg{margin-bottom:24px;font-size:27px;color:#3A3650;display:flex;gap:14px;align-items:baseline}
.slack .smsg b{font-size:29px;color:var(--ink)}
.slack .smsg em{font-style:normal;font-weight:700;color:#611f69;flex:none}
/* hubspot */
.hub{display:flex;gap:22px}
.hub .hcol{flex:1;background:#F6F3EB;border-radius:14px;padding:18px}
.hub .hcol b{display:block;font-size:24px;color:#5E5A70;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.hub .hcard{height:88px;border-radius:10px;background:#fff;border:2px solid #ECE8DD;margin-bottom:12px;
  font-size:24px;color:var(--ink);padding:12px 14px;font-weight:600}
.hub .hi{border-color:#E8843C;box-shadow:0 0 0 3px rgba(232,132,60,.25)}

/* ── grid scene (block C) — a scrim over the presenter's footage, not a void ── */
#grid{position:absolute;inset:0;z-index:25;background:
   radial-gradient(1100px 900px at 50% 34%, rgba(36,108,224,.30), transparent 68%),
   rgba(4,1,32,.80);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;padding:180px 90px}
#gwrap{display:grid;grid-template-columns:repeat(3,168px);grid-template-rows:repeat(2,168px);gap:34px}
#gwrap .gc{width:168px;height:168px;border-radius:38px;background:#FDF8F0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 56px rgba(36,108,224,.30)}
#gwrap .gc img{width:92px;height:92px;object-fit:contain}
#grule{width:0;height:3px;background:var(--tint);opacity:.8}
#glabel{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:38px;letter-spacing:.14em;
  color:var(--tint);text-transform:uppercase}

/* ── the "sits on top" row (block G) — CHEST band (round-1 note) ── */
#stack{position:absolute;inset:0;z-index:20;pointer-events:none}
/* round 3: the hierarchy — Client clear of the presenter's chin, connector lines, row lower */
#dtile{position:absolute;left:435px;top:920px;width:210px;height:210px;border-radius:48px;
  background:#0D1230;border:2px solid rgba(130,150,220,.3);display:flex;align-items:center;
  justify-content:center;box-shadow:0 0 80px rgba(36,108,224,.5)}
#dtile img{width:118px}
.hline{position:absolute;border-radius:2px}
#lrail{background:repeating-linear-gradient(90deg,rgba(218,232,255,.6) 0 9px,transparent 9px 22px)}
#ltrunk,.ldrop{background:repeating-linear-gradient(180deg,rgba(218,232,255,.6) 0 9px,transparent 9px 22px)}
#ltrunk{left:538px;top:1130px;width:4px;height:40px;transform-origin:top center}
#lrail{left:215px;top:1168px;width:650px;height:4px;transform-origin:center}
.ldrop{width:4px;height:38px;top:1172px;transform-origin:top center}
#srow{position:absolute;left:0;right:0;top:1210px;height:120px;display:flex;justify-content:center;
  align-items:center;gap:18px}
#srow .sc{width:112px;height:112px;border-radius:26px;background:rgba(253,248,240,.95);
  display:flex;align-items:center;justify-content:center}
#srow .sc img{width:62px;height:62px;object-fit:contain}

/* ── the Client app (block F) — the REAL dark chrome over the presenter's footage ── */
#ui{position:absolute;inset:0;z-index:25}
#win{position:absolute;left:70px;top:330px;width:940px;height:1180px;border-radius:30px;
  background:var(--appbg);overflow:hidden;border:1.5px solid var(--appline);
  box-shadow:0 0 90px rgba(36,108,224,.30)}
#bar{height:64px;background:var(--appbg2);display:flex;align-items:center;padding:0 26px;gap:12px}
#bar i{width:17px;height:17px;border-radius:50%;display:block}
#body{padding:30px 34px;display:flex;flex-direction:column;gap:22px;height:calc(100% - 64px)}
#greet{font-family:"Season",serif;font-weight:400;font-size:54px;color:var(--apptext);letter-spacing:.01em}
#composer{border:2px solid rgba(87,120,220,.55);border-radius:22px;background:var(--appinset);
  padding:24px 28px;display:flex;flex-direction:column;gap:20px;
  box-shadow:0 0 44px rgba(36,108,224,.18)}
#ctext{font-size:38px;color:var(--apptext);min-height:50px;line-height:1.3}
#ctext.ph{color:#6E7494}
#ctext .car{display:inline-block;width:3px;height:40px;background:var(--blue);
  transform:translateY(6px);margin-left:3px}
#crow{display:flex;align-items:center;gap:16px}
#crow .plus{font-size:38px;color:#6E7494;line-height:1}
#crow .sp{flex:1}
#fnk{font-family:"IBM Plex Mono",monospace;font-size:24px;color:#9FB4E8;background:#1A2142;
  border-radius:11px;padding:8px 15px;letter-spacing:.04em}
#hold{font-size:28px;color:var(--appdim)}
#send{width:60px;height:60px;border-radius:15px;background:#202748;display:flex;
  align-items:center;justify-content:center;font-size:32px;color:#8A91B4}
#req{align-self:flex-end;max-width:680px;background:#CFE0FA;color:#16305E;font-size:32px;
  line-height:1.34;border-radius:20px;padding:18px 26px}
.card{border-radius:22px;background:var(--appcard);padding:24px 26px;display:flex;
  flex-direction:column;gap:14px;border:1.5px solid var(--appline)}
.card .ch{display:flex;align-items:flex-start;gap:16px}
.card .ct{flex:1}
.card .tag{font-family:"IBM Plex Mono",monospace;font-size:22px;letter-spacing:.16em;color:var(--appdim)}
.card .ttl{font-size:34px;font-weight:600;color:#F0F3FC;margin-top:4px}
.card .lg{width:54px;height:54px;border-radius:13px;background:#fff;display:flex;
  align-items:center;justify-content:center}
.card .lg img{width:34px;height:34px;object-fit:contain}
.card .ln{font-size:28px;color:#A9B0CE;line-height:1.4}
.card .ac{background:var(--appinset);border-radius:14px;padding:16px 20px;font-size:25px;
  color:#C6CCE4;line-height:1.42}
.card .ac b{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.16em;color:#6E7494;
  font-weight:400;display:block;margin-bottom:8px}
/* the payoff, inside the same window: both tasks ticked + the untouched dock.
   ABSOLUTE, not flexed under the cards — stacked, the column overflows the
   window's 1180px and the whole payoff clips into invisibility (caught on the
   round-2 QA sheet: frames 26.5 and 27.0 were identical to 25.8). The two
   phases swap: cards fade out at 26.20, this fades in over the same area. */
#phase2{position:absolute;left:34px;right:34px;top:560px;bottom:280px;display:flex;
  flex-direction:column;gap:16px;opacity:0}
#ticks{display:flex;flex-direction:column;gap:12px}
#ticks .trow{border-radius:15px;background:var(--appcard);padding:14px 18px;display:flex;
  align-items:center;gap:14px;border:1.5px solid var(--appline)}
#ticks .trow img{width:36px;height:36px;object-fit:contain}
#ticks .trow span{font-size:27px;color:var(--apptext);font-weight:500}
#ticks .trow .ok{margin-left:auto;font-size:29px;color:#4ADE80}
/* round 2: dock at the BOTTOM of the card, icons in colour */
#minidock{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:auto}
#minidock .di{width:84px;height:84px;border-radius:21px;background:rgba(253,248,240,.95);
  display:flex;align-items:center;justify-content:center}
#minidock .di img{width:48px;height:48px;object-fit:contain}
#dlabel{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:27px;letter-spacing:.14em;
  color:var(--appdim);text-transform:uppercase;margin-top:6px}

/* (round 6: endcard styles removed — the client outro clip is the CTA) */

/* ── the CTA pill on the presenter's last line ─────────────────────────────── */
#ctapill{position:absolute;left:50%;top:1130px;transform:translateX(-50%);z-index:29;
  background:var(--blue);color:#fff;font-size:40px;font-weight:600;padding:22px 44px;
  border-radius:999px;white-space:nowrap;box-shadow:0 0 66px rgba(36,108,224,.6)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

/* ── four chips land over the b-roll, one per spoken word ───── */
const chipAt = [0.0];
const chipIx = [3];
chipAt.forEach((t, i) => {
  tl.from("#c" + (chipIx[i] + 1), { opacity: 0, y: 24, duration: .50, ease: "power2.out" }, t);
});

/* ── split pane: the six tools' UIs swipe one by one ──────────
   FLAT literal statements, not a forEach: the chunk emitter can only rebase
   literal positions, and these live in c2 whose clock starts at 4.7667. */
/* round 12: the SPLIT is back (the client's note) — soft sequential swipes, one card
   visible at a time, ChatGPT holds to the end of the beat */
tl.fromTo("#tc-docs", { xPercent: 112 }, { xPercent: 0, duration: .50, ease: "power2.out" }, 0.7666);
tl.to("#tc-docs", { xPercent: -112, duration: .35, ease: "power2.inOut" }, 1.1833);
tl.fromTo("#tc-gpt",  { xPercent: 112 }, { xPercent: 0, duration: .50, ease: "power2.out" }, 1.4733);

/* ── grid scene ─────────────────────────────────────────────── */
tl.fromTo("#grid", { opacity: 0 }, { opacity: 1, duration: .35, ease: "power2.out" }, 3.9666);
tl.from("#gwrap .gc", { opacity: 0, y: 18, duration: .50, stagger: .09, ease: "power2.out" }, 4.0833);
tl.to("#grule", { width: 470, duration: .45, ease: "power2.inOut" }, 4.8333);
tl.from("#glabel", { y: 18, opacity: 0, duration: .40, ease: "power2.out" }, 5.0833);

/* ── block D: tools connect, context flows between them ─────── */
/* the graph assembles: chips pop playfully, spokes dot in, dots ride them */
tl.from("#m1", { opacity: 0, y: 18, duration: .45, ease: "power2.out" }, 5.9133);
tl.from("#m2", { opacity: 0, y: 18, duration: .45, ease: "power2.out" }, 6.0233);
tl.from("#m3", { opacity: 0, y: 18, duration: .45, ease: "power2.out" }, 6.1333);
tl.from("#m4", { opacity: 0, y: 18, duration: .45, ease: "power2.out" }, 6.2433);
tl.from("#m5", { opacity: 0, y: 18, duration: .45, ease: "power2.out" }, 6.3533);
tl.from("#m6", { opacity: 0, y: 18, duration: .45, ease: "power2.out" }, 6.4633);
tl.fromTo("#webs path", { opacity: 0 }, { opacity: 1, duration: .40, stagger: .09, ease: "power2.out" }, 6.7833);
tl.fromTo(".sdot", { opacity: 0, scale: .4 }, { opacity: 1, scale: 1, duration: .35, stagger: .07, ease: "back.out(1.6)" }, 7.2833);
/* two bright dots travel the curves — context moving between tools */
tl.fromTo("#td1", { x: 0, y: 0, opacity: 0 }, { opacity: 1, duration: .12 }, 7.3933);
tl.to("#td1", { x: 324, y: 28, duration: 0.18, ease: "none" }, 7.5333);
